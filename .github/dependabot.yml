# Dependabot configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor + patch updates are grouped per ecosystem into a single PR and are
# merged automatically by .github/workflows/dependabot-auto-merge.yml once the
# PR's checks pass. Major updates get their own PR for manual review.
version: 2
updates:
  # PHP / Composer dependencies (composer.json at the repo root).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # Docker base image (docker/php/Dockerfile).
  - package-ecosystem: "docker"
    directory: "/docker/php"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Skip PHP pre-releases (alpha/beta/RC); GA and patch releases still come through.
    # Dependabot lowercases docker tags and compares them as Ruby versions, so
    # 8.6.0RC3 becomes 8.6.0.rc3, which falls in [8.6.0.a, 8.6.0). Add a line per next minor.
    ignore:
      - dependency-name: "php"
        versions:
          - ">= 8.6.0.a, < 8.6.0"
          - ">= 8.7.0.a, < 8.7.0"
          - ">= 9.0.0.a, < 9.0.0"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # Images in docker-compose.yml at the repo root.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # GitHub Actions used by workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
